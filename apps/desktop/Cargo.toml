[package]
name = "paper-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
paper-metadata = { path = "../../crates/paper-metadata" }
paper-core = { path = "../../crates/paper-core" }
paper-storage = { path = "../../crates/paper-storage" }
slint.workspace = true
chrono.workspace = true
thiserror.workspace = true
uuid.workspace = true
# Already in the dependency tree through Slint; opens links without a shell.
webbrowser = "1"
# Native file chooser for attaching PDFs; no shell or web view involved.
rfd = "0.18"
# Reads the text and information dictionary of a PDF to find its DOI or arXiv ID.
lopdf = { version = "0.47", default-features = false }

[build-dependencies]
slint-build = "1"


[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
rusqlite.workspace = true
