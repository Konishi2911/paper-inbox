name: Release

# Builds unsigned binaries for a version tag (v0.1.0, ...) and attaches them to a draft release.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p paper-desktop
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir="paper-inbox-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp target/release/paper-desktop.exe "$dir/"
          cp LICENSE LICENSE-MIT LICENSE-APACHE README.md THIRD-PARTY-NOTICES.md "$dir/"
          cp -r LICENSES "$dir/"
          7z a "$dir.zip" "$dir"
      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dir="paper-inbox-${GITHUB_REF_NAME}-${{ matrix.name }}"
          app="$dir/Paper Inbox.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/paper-desktop "$app/Contents/MacOS/"
          cp apps/desktop/assets/icons/icon.icns "$app/Contents/Resources/icon.icns"
          sed "s/@VERSION@/${GITHUB_REF_NAME#v}/" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp LICENSE LICENSE-MIT LICENSE-APACHE README.md THIRD-PARTY-NOTICES.md "$dir/"
          cp -r LICENSES "$dir/"
          # ditto keeps the bundle's permissions; the app is unsigned (see README).
          ditto -c -k --keepParent "$dir" "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: paper-inbox-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --generate-notes
