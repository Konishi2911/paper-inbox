name: Release

# Builds unsigned binaries for a version tag (v0.1.0, ...) and attaches them to a draft release.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest, binary: paper-desktop.exe }
          - { name: macos-arm64, os: macos-latest, binary: paper-desktop }
          - { name: macos-x86_64, os: macos-15-intel, binary: paper-desktop }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p paper-desktop
      - name: Package
        shell: bash
        run: |
          dir="paper-inbox-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.binary }}" "$dir/"
          cp LICENSE LICENSE-MIT LICENSE-APACHE README.md "$dir/"
          cp -r LICENSES "$dir/"
          [ -f THIRD-PARTY-NOTICES.md ] && cp THIRD-PARTY-NOTICES.md "$dir/" || true
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$dir.zip" "$dir"; else zip -r "$dir.zip" "$dir"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: paper-inbox-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --generate-notes
